apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-server
  namespace: smartcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-server
  template:
    metadata:
      labels:
        app: oauth-server
    spec:
      containers:
        - name: oauth-server
          image: ghcr.io/ainaa0099/smartcity-oauth-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: PORT_AUTH
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: DB_PASS
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_ACCESS_EXPIRES
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: JWT_ACCESS_EXPIRES
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_REFRESH_EXPIRES
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: JWT_REFRESH_EXPIRES
            - name: GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: GATEWAY_INTERNAL_SECRET
            - name: IPINFO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: IPINFO_TOKEN
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: GITHUB_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: GITHUB_CALLBACK_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: GOOGLE_CALLBACK_URL
            - name: FACEBOOK_APP_ID
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: FACEBOOK_APP_ID
            - name: FACEBOOK_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: FACEBOOK_APP_SECRET
            - name: FACEBOOK_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: FACEBOOK_CALLBACK_URL
            - name: FRONTEND_SUCCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: FRONTEND_SUCCESS_URL
            - name: FRONTEND_ERROR_URL
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: FRONTEND_ERROR_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: oauth-server
  namespace: smartcity
spec:
  type: ClusterIP
  selector:
    app: oauth-server
  ports:
    - name: http
      port: 3002
      targetPort: 3002

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smartcity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/ainaa0099/smartcity-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: smartcity-config
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: PORT_GATEWAY
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: JWT_REFRESH_SECRET
            - name: GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: GATEWAY_INTERNAL_SECRET
          readinessProbe:
            httpGet:
              path: /api/metrics
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smartcity
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
