---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: smartcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      initContainers:
        - name: install-node-red-flows
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              cp /config/flows.json /data/flows.json
              chown 1000:1000 /data/flows.json
          volumeMounts:
            - name: node-red-data
              mountPath: /data
            - name: node-red-flows
              mountPath: /config
              readOnly: true
      containers:
        - name: node-red
          image: nodered/node-red:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
          env:
            - name: TZ
              value: "Asia/Jakarta"
            - name: MQTT_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: MQTT_HOST
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: MQTT_PORT
            - name: GATEWAY_URL
              value: "http://api-gateway:3000"
          volumeMounts:
            - name: node-red-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 1880
            initialDelaySeconds: 25
            periodSeconds: 10
      volumes:
        - name: node-red-data
          persistentVolumeClaim:
            claimName: node-red-data
        - name: node-red-flows
          configMap:
            name: node-red-flows

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-red-data
  namespace: smartcity
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: smartcity
spec:
  type: ClusterIP
  selector:
    app: node-red
  ports:
    - name: http
      port: 1880
      targetPort: 1880
