apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: smartcity
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: smartcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: RABBITMQ_PASS
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: rabbitmq-data
          emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: smartcity
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true

---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: smartcity
spec:
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: smartcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
      volumes:
        - name: mosquitto-config
          configMap:
            name: mosquitto-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: smartcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      containers:
        - name: node-red
          image: nodered/node-red:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
          env:
            - name: MQTT_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: MQTT_HOST
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: MQTT_PORT
            - name: GATEWAY_URL
              value: "http://api-gateway:3000"

---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: smartcity
spec:
  type: ClusterIP
  selector:
    app: node-red
  ports:
    - name: http
      port: 1880
      targetPort: 1880
