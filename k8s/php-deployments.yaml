apiVersion: apps/v1
kind: Deployment
metadata:
  name: citizen-service
  namespace: smartcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citizen-service
  template:
    metadata:
      labels:
        app: citizen-service
    spec:
      containers:
        - name: citizen-service
          image: ghcr.io/ainaa0099/smartcity-citizen-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: smartcity-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: DB_PASS
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: smartcity-secrets
                  key: RABBITMQ_PASS
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: citizen-service
  namespace: smartcity
spec:
  type: ClusterIP
  selector:
    app: citizen-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000

