name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ainaa0099

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push oauth-server
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/smartcity-oauth-server:latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/smartcity-api-gateway:latest

      - name: Build and push citizen-service
        uses: docker/build-push-action@v5
        with:
          context: ./php-citizen
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/smartcity-citizen-service:latest

      - name: Build and push airquality-service
        uses: docker/build-push-action@v5
        with:
          context: ./air-quality-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/smartcity-airquality-service:latest

      - name: Build and push environment-service
        uses: docker/build-push-action@v5
        with:
          context: ./environment-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/smartcity-environment-service:latest

      - name: Build and push python-ml
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/smartcity-python-ml:latest

      - name: Build and push iot-simulator
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/smartcity-iot-simulator:latest
